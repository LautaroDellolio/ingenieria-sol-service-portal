<style>
        .grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(118, 119, 125, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(118, 119, 125, 0.1) 1px, transparent 1px);

            outline: none;

<body class="bg-surface-bright grid-pattern min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop text-on-surface font-body-md">
<div class="w-full max-w-md bg-surface-container-lowest border border-outline-variant shadow-sm rounded-lg overflow-hidden flex flex-col">
<!-- Header -->
<div class="bg-primary-container p-xl flex flex-col items-center justify-center border-b border-outline-variant">
<img class="w-16 h-16 mb-md object-contain" data-alt="A minimalist, high-contrast flat industrial logo for an engineering company named Ingenieria Sol. The logo features a geometric sun emblem combined with structural elements in deep slate blue and crisp white. Modern, precise, corporate identity design." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAfJNs9YQy5v1BR_dGtbqs04mg_TIctuPF4z-_PrnGSFYsLgZPFVDPU9vHIrX81f8tQeuocPkQpR7His1CTWTCADTs_WxfHOTyBFTFXoW_L2nliSASP4xtdJYXjXAVAC7bhaXgkWul2TF6A8JwnEZ_Tz3JM3oxvHQ84WtbwisJA9KTAURmH4j_fIIbtJlGoWtGUGQnMnz9kkZ14RaiGmaBkTnBUIPRQf_uxV7P-DUGEC51tQM-6YFlnapJ6b93atCB__sc3PXpUDzw"/>
<h1 class="font-headline-md text-headline-md font-bold text-on-primary">Ingenieria Sol</h1>
<p class="font-body-sm text-body-sm text-primary-fixed-dim mt-xs">Portal de Operaciones Empresariales</p>
</div>
<!-- Form -->
<div class="p-xl flex flex-col gap-lg">
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Username -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-xs" for="username">
<span class="material-symbols-outlined text-[16px]">person</span>
                        Usuario
                    </label>
<div class="relative">
<input class="w-full border border-outline rounded bg-surface-bright px-md py-sm font-body-md text-body-md text-on-surface focus:border-primary focus:border-2 transition-all" id="username" name="username" placeholder="operator_id" required="" type="text"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant flex items-center gap-xs" for="password">
<span class="material-symbols-outlined text-[16px]">lock</span>
                            Contraseña
                        </label>
<a class="font-label-sm text-label-sm text-secondary hover:text-secondary-container transition-colors" href="#">¿Olvidó su contraseña?</a>
</div>
<div class="relative">
<input class="w-full border border-outline rounded bg-surface-bright px-md py-sm font-body-md text-body-md text-on-surface focus:border-primary focus:border-2 transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-sm mt-xs">
<input class="w-4 h-4 rounded border-outline text-primary focus:ring-primary focus:ring-offset-surface-container-lowest" id="remember" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant" for="remember">Sesión Segura</label>
</div>
<!-- Submit -->
<button class="mt-md bg-secondary text-on-secondary font-label-md text-label-md py-md px-lg rounded flex items-center justify-center gap-sm hover:bg-secondary-container transition-colors shadow-sm" type="submit">
                    Iniciar Sesión
                    <span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
</div>
<!-- Footer -->
<div class="bg-surface-container-low p-md border-t border-outline-variant text-center">
<p class="font-label-sm text-label-sm text-on-surface-variant">Solo personal autorizado. Sistema monitoreado.</p>
</div>
</div>
</body></html>
